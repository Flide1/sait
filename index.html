<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Raf Simons</title>

    <link rel="stylesheet" href="style.css">

    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Главный экран -->
    <section class="main">
        <p class="subtitle">BELGIUM • MODE • DESIGN</p>
        <h1 class="no-select">Raf Simons</h1>
    </section>

    <!-- Карточки -->
    <section class="events">
        <div class="cards">
            <div class="event-card">
                <h2>D+A TOUR</h2>
                <p>Fashion Mode</p>
            </div>

            <div class="event-card">
                <h2>OUR HOME</h2>
                <p>Paris mode dom</p>
            </div>

            <div class="event-card">
                <h2>OUR HISTORY</h2>
                <p>you must know your history</p>
            </div>

            <div class="event-card">
                <h2>NEW COLLECTION</h2>
                <p>AVAILABLE ONLY UNTIL 2027</p>
            </div>
        </div>
    </section>

    <!-- Следующая секция -->
    <section class="next-section">
        <h2>THE WORLD OF RAF SIMONS</h2>
        <p>CFDA Fashion Awards, The Fashion Awards и Swiss Textiles Award</p>
    </section>

</body>
</html>
